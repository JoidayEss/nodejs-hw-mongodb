type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 34e78ewqe286b30065d54fa3
  name:
    description: 'Contacts name'
    type: string
    example: 'Tomashchuk Artem'
  phoneNumber:
    description: 'Contact phone number'
    type: string
    example: '+380(99)2827437'
  email:
    description: 'Contacts email'
    type: string
    example: 'artem@mail.com'
  isFavourite:
    description: 'Contacts in the favourite list'
    type: boolean
    example: true
  contactType:
    description: 'Contacts number type'
    type: string
    enum: ['work', 'home', 'personal']
    example: personal
  userId:
    description: 'Contacts user id'
    type: string
    example: 34e78ewqe286b30065d54fa3
  photo:
    description: 'Link to contacts photo'
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.jpg
